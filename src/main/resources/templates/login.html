<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập hệ thống - UTE Sport</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #064e3b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .login-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      color: #f8fafc;
    }
    .brand-box {
      text-align: center;
      margin-bottom: 30px;
    }
    .brand-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 12px;
      box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4);
    }
    .brand-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin: 0;
      color: #fff;
    }
    .brand-subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .role-tabs {
      display: flex;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .role-tab {
      flex: 1;
      text-align: center;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .role-tab.active {
      background: #10b981;
      color: #fff;
      box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }
    .form-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #94a3b8;
    }
    .forgot-link {
      color: #34d399;
      text-decoration: none;
    }
    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4);
      transition: all 0.2s;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
    }
    .footer-text {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-box">
      <div class="brand-icon">🏸</div>
      <h1 class="brand-title">UTE SPORT BADMINTON</h1>
      <div class="brand-subtitle">Hệ thống quản lý chuỗi sân cầu lông thông minh</div>
    </div>

    <div class="role-tabs">
      <div class="role-tab active">Quản Trị / Nhân Viên</div>
      <div class="role-tab">Khách Hàng</div>
    </div>

    <form action="/director/dashboard" method="GET">
      <div class="form-group">
        <label class="form-label">Tài khoản / Email / Số điện thoại</label>
        <input type="text" class="form-input" placeholder="Nhập tên đăng nhập..." value="admin_phuoctho" required>
      </div>

      <div class="form-group">
        <label class="form-label">Mật khẩu</label>
        <input type="password" class="form-input" placeholder="Nhập mật khẩu..." value="••••••••••••" required>
      </div>

      <div class="form-footer">
        <label class="remember-me">
          <input type="checkbox" checked> Ghi nhớ đăng nhập
        </label>
        <a href="#" class="forgot-link">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="btn-login">ĐĂNG NHẬP HỆ THỐNG</button>
    </form>

    <div class="footer-text">
      Bản quyền © 2026 UTE Sport - Đồ án Công Nghệ Phần Mềm HCMUTE
    </div>
  </div>
</body>
</html>
