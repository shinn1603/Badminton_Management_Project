# ==========================================
# PRODUCTION PROFILE CONFIGURATION
# ==========================================
server.port=${PORT:8080}

# Database DataSource for Production (Docker / Cloud SQL / Azure / Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=badminton_management;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate & JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=false

# File Upload Limits for Cloudinary & Receipts
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Cloudinary CDN Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:utesport-arena}
cloudinary.api-key=${CLOUDINARY_API_KEY:348571948271842}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:XyZ9876543210-abcdef}

# AI Chatbot Google Gemini API
gemini.api.key=${GEMINI_API_KEY:}

# JWT Security
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}
