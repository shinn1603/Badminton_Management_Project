spring.application.name=Badminton_Management_Project
server.port=8080

# Microsoft SQL Server Configuration (Database: badminton, User: sa, Password: 123456)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=badminton;encrypt=true;trustServerCertificate=true;
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=123456
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf & Encoding Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Google Gemini Cloud AI Configuration
# Pass key via environment variable: GEMINI_API_KEY
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-1.5-flash

# JWT Authentication Configuration
jwt.secret=${JWT_SECRET:UTE_BADMINTON_MANAGEMENT_SUPER_SECRET_KEY_2026_JWT_TOKEN_CHAIN_PRO}

# Cloudinary Storage Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:utesport-arena}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# VietQR Webhook Security Configuration
vietqr.webhook.token=${VIETQR_WEBHOOK_TOKEN:UTE_VIETQR_SECRET_TOKEN_2026}

