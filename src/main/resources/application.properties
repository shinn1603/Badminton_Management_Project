spring.application.name=Badminton_Management_Project
server.port=8080

# Microsoft SQL Server Configuration (Database: badminton, User: sa, Password: 123456)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=badminton;encrypt=true;trustServerCertificate=true;}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false

# Thymeleaf & Encoding Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Google Gemini Cloud AI Configuration
# Pass key via environment variable: GEMINI_API_KEY
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-1.5-flash

# JWT Authentication Configuration
jwt.secret=${JWT_SECRET:UTE_BADMINTON_MANAGEMENT_SUPER_SECRET_KEY_2026_JWT_TOKEN_CHAIN_PRO}

# Cloudinary Storage Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:utesport-arena}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# VietQR Webhook & Payment Configuration
vietqr.webhook.token=${VIETQR_WEBHOOK_TOKEN:UTE_VIETQR_SECRET_TOKEN_2026}
vietqr.bank.bin=${VIETQR_BANK_BIN:970422}
vietqr.bank.name=${VIETQR_BANK_NAME:MBBank (Ngân hàng Quân Đội)}
vietqr.account.no=${VIETQR_ACCOUNT_NO:0903123456}
vietqr.account.name=${VIETQR_ACCOUNT_NAME:UTE BADMINTON CLUB}

