spring.application.name=Badminton_Management_Project
server.port=8080

# H2 In-Memory Database Configuration (Dev & UI Testing - No Docker/External DB needed)
spring.datasource.url=jdbc:h2:mem:badminton;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf & Encoding Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Google Gemini Cloud AI Configuration
# Pass key via environment variable: GEMINI_API_KEY
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-1.5-flash
